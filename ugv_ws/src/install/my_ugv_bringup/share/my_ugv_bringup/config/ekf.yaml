ekf_filter_node:
  ros__parameters:
    # 1. Timing and Basic Settings
    frequency: 20.0           # Dropped to 20Hz to give the Pi 5 breathing room
    sensor_timeout: 0.1
    two_d_mode: true          
    publish_tf: true          
    print_diagnostics: true
    
    # NEW: Timing Patience for the Pi 5
    smooth_lagged_data: true
    history_length: 1.0

    # 2. Frame Setup - CRITICAL ALIGNMENT
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint  # <--- CHANGED THIS from base_link
    world_frame: odom

    # 3. Encoder Configuration (odom0)
    odom0: /odom
    odom0_config: [false, false, false, 
                   false, false, false, 
                   true,  false, false, # Trust vx
                   false, false, true]  # Trust vyaw
    odom0_differential: false
    odom0_relative: true

    # 4. IMU Configuration (imu0)
    imu0: /oak/imu/data
    imu0_config: [false, false, false, 
                  false, false, true,  # Trust IMU Yaw
                  false, false, false, 
                  false, false, true,  # Trust IMU Gyro
                  false, false, false] 
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
