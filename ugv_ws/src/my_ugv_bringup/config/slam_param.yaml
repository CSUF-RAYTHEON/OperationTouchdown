slam_toolbox:
  ros__parameters:
    # ── Solver ────────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── ROS frames ────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: false
    mode: mapping  # change to 'localization' when running with a saved map

    # ── General ───────────────────────────────────────────────────────────────
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02   # 50 Hz TF
    map_update_interval: 0.3         # seconds between map publishes — more frequent in open field
    resolution: 0.05                 # 5 cm — good for 15×15 yard outdoor field
    max_laser_range: 10.0            # RPLidar A1 reliable range (12 m max)
    minimum_time_interval: 0.2       # 5 Hz scan processing (gentle on Pi 4)
    transform_timeout: 0.5           # increased: Pi 5 TF latency under load
    message_filter_queue_size: 100    # default is 10, increase for Pi 5 TF latency
    tf_buffer_duration: 60.0         # increased: retain history across odom gaps
    stack_size_to_use: 40000000      # 40 MB stack for Raspberry Pi

    # ── Loop closure ─────────────────────────────────────────────────────────
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3     # outdoor: only match after real movement to avoid featureless snap-backs
    minimum_travel_heading: 0.3      # ~17 deg; update on small turns in open field
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.8    # raised from 0.45 — reject poor outdoor matches
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.6  # raised from 0.35
    loop_match_minimum_response_fine: 0.8    # raised from 0.45

    # ── Correlation ──────────────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ── Loop-closure correlation ─────────────────────────────────────────────
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Scan matcher ─────────────────────────────────────────────────────────
    distance_variance_penalty: 1.0   # raised from 0.5 — trust odometry more than featureless scans
    angle_variance_penalty: 2.0      # raised from 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.95      # raised from 0.9
    minimum_distance_penalty: 0.8    # raised from 0.5
    use_response_expansion: false    # don't try to salvage poor outdoor matches
