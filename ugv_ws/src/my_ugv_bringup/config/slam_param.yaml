slam_toolbox:
  ros__parameters:

    # 1. General Logistics
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_merged    # FIXED: Use the combined asset
    mode: mapping

    # 2. DATA INTEGRITY & STABILITY
    transform_timeout: 0.1         
    scan_buffer_size: 10          # REDUCED: Lowers memory overhead
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1 

    # 3. Solver settings (Sticking with Ceres)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT

    # 4. Mapping Process settings
    resolution: 0.05             # High-Def resolution (5cm)
    do_loop_closure: true
    loop_search_distance: 8.0     # Wider search for better "Matching"
    
    # 5. CPU THROTTLING (The "Efficiency" Policy)
    max_laser_range: 12.0        # Use the Lidar's full indoor reach
    minimum_time_interval: 0.3    # Update map 3x per second (Saves CPU)
    minimum_travel_distance: 0.1  # Only update if robot moves 10cm
    minimum_travel_heading: 0.1   # Only update if robot turns ~6 degrees
    
    transform_publish_period: 0.05 # Keep TF high (20Hz) for smooth navigation
    map_update_interval: 5.0      # Only re-draw the global map every 5s