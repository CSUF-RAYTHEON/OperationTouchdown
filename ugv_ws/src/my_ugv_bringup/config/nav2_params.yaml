behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    recovery_plugins: ["spin", "backup", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.4
      
    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 2.0
      fixed_delay: 1.0
      
    wait:
      plugin: "nav2_behaviors::Wait"
      simulate_ahead_time: 3.0

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_frame: odom
    transform_tolerance: 0.5        # Reduced from 2.0
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    server_timeout: 2.0

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    transform_tolerance: 0.5        # Reduced from 2.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 5.0 
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      transform_tolerance: 0.5      # Reduced from 2.0
      time_steps: 15
      model_dt: 0.2
      batch_size: 20
      vtheta_max: 1.0
      vx_min: 0.1    
      vx_max: 0.2   
      visualize_candidates: true
      motion_model: "DiffDrive"
      ReferenceTrajectory:
        low_cost_priority: true 
      enforce_path_costs: true
      cost_weight: 7.0
      path_align_weight: 10.0
      goal_align_weight: 0.0
      path_dist_weight: 5.0
      obstacle_dist_weight: 20.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom            # Changed from map — decouples from SLAM drift
      robot_base_frame: base_footprint
      transform_tolerance: 0.5     # Reduced from 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.1
      robot_radius: 0.15
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan              # Changed from /scan_merged — RPLidar only outdoors
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          obstacle_max_range: 4.0   # Increased from 2.5
          obstacle_min_range: 0.4   # Added — filter near-field returns
          raytrace_max_range: 6.0   # Increased from 3.0 — aggressively clear free space
          raytrace_min_range: 0.4   # Added — filter near-field returns
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 
        inflation_radius: 0.35   

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    use_sim_time: False
    transform_tolerance: 0.5       # Reduced from 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 2.0
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5     # Reduced from 2.0
      robot_radius: 0.15 
      use_sim_time: False
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan              # Changed from /scan_merged — RPLidar only outdoors
          data_type: "LaserScan"
          obstacle_max_range: 4.0   # Increased from 2.5
          obstacle_min_range: 0.4   # Added — filter near-field returns
          raytrace_max_range: 6.0   # Increased from 3.0 — aggressively clear free space
          raytrace_min_range: 0.4   # Added — filter near-field returns
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 2.0
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "stop"
      points: "[[0.25, 0.25], [0.25, -0.25], [-0.1, -0.25], [-0.1, 0.25]]"
      min_points: 3
      visualize: True
      polygon_pub_topic: "footprint_approach_viz"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"                # Changed from /scan_merged

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    dock_plugins: ['simple_dock'] 
    simple_dock:
      plugin: "opennav_docking::SimpleNonChargingDock"

route_server:
  ros__parameters:
    use_sim_time: false
    graph_file: ""

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ['controller_server', 'smoother_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother', 'collision_monitor', 'route_server', 'docking_server']
