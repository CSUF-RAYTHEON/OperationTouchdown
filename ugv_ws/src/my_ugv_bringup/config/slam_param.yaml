slam_toolbox:
  ros__parameters:

    # 1. General Logistics
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan               # Option B: RPLidar only — no depth camera outdoors
    mode: mapping

    # 2. DATA INTEGRITY & STABILITY
    transform_timeout: 0.1
    scan_buffer_size: 30            # Increased from 10 — more history for open-loop correction
    scan_buffer_maximum_scan_distance: 8.0  # Reduced from 12.0 — match reliable outdoor range
    link_match_minimum_response_fine: 0.35  # Increased from 0.1 — reject weak/ambiguous matches
    link_scan_maximum_distance: 1.5         # Added — limit scan link distance
    use_scan_matching: true                 # Explicit
    throttle_scans: 1                       # Process every scan

    # 3. Solver settings (Sticking with Ceres)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT

    # 4. Mapping Process settings
    resolution: 0.10               # Increased from 0.05 — coarser reduces noise outdoors
    do_loop_closure: true
    loop_search_distance: 15.0     # Increased from 8.0 — larger search for open spaces
    loop_match_minimum_chain_size: 8          # Added — stricter loop closure validation
    loop_match_maximum_variance_coarse: 2.0   # Added — reject bad loop candidates

    # 5. RANGE FILTERING (reject ground hits and self-reflections)
    minimum_laser_range: 0.4       # Added — filter out near-field ground/body returns
    max_laser_range: 8.0           # Reduced from 12.0 — A1 unreliable at 12m outdoors

    # 6. SCAN ACCEPTANCE THRESHOLDS
    minimum_time_interval: 0.5     # Increased from 0.3 — avoid redundant scans
    minimum_travel_distance: 0.3   # Increased from 0.1 — avoid degenerate registration
    minimum_travel_heading: 0.2    # Increased from 0.1 — ~11 degrees

    transform_publish_period: 0.05  # Keep TF at 20Hz for smooth navigation
    map_update_interval: 2.0        # Reduced from 5.0 — fresher map updates
